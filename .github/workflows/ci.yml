name: CI - Run Tests on PR to Main

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Ballerina Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: 2201.13.4

      - name: Write Config.toml
        run: |
          cat <<EOF > Config.toml
          port = 9090

          [databaseConfig]
          url      = "jdbc:h2:mem:productsdb;DB_CLOSE_DELAY=-1"
          user     = "sa"
          password = ""
          EOF

      - name: Run tests
        run: bal test
